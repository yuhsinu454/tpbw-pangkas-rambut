<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Pangkas Rambut Bandung</title>
    
    <!-- Memanggil CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1c1c1e;
            color: #f1c40f;
            padding: 15px 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 1000; 
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0 0; font-size: 14px; color: #ecf0f1; }

        .main-container {
            display: flex;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            margin: 0;
            font-size: 18px;
            color: #2c3e50;
            border-bottom: 2px solid #f1c40f;
            padding-bottom: 10px;
        }

        .info-box {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            color: #7f8c8d;
            border: 1px solid #e9ecef;
            text-align: center;
            line-height: 1.5;
        }

        #map { 
            flex: 1;
            width: 100%;
            height: 100%;
        } 
    </style>
</head>
<body>

    <header>
        <h1>💈 Barbershop & Asgar Finder</h1>
        <p>Sistem Informasi Geografis Kota Bandung | Tugas Teknologi Pemetaan Berbasis Web</p>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <h2>Navigasi & Filter</h2>
            
            <div class="info-box">
                <b>Area: Kota Bandung</b><br><br>
                Data pemetaan lokasi pangkas rambut, barbershop, dan salon.
                <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
                <i>(Fitur Filter Kategori akan ditambahkan di sini nantinya)</i>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <!-- Memanggil JavaScript Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Inisialisasi Peta (Koordinat digeser ke pusat Kota Bandung, Zoom diperkecil jadi 13)
        const map = L.map('map').setView([-6.914744, 107.609810], 13);

        // 2. Memuat Peta Dasar
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // ==========================================
        // Area ini siap menerima data dari Database
        // ==========================================
    </script>
</body>
</html>
